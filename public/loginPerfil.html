<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN DE PERFIL</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="mensagens">
        <h1>BEM-VINDO DE 
            <span>VOLTA</span>, 
            AVENTUREIRO(A)!
        </h1>
        <p> Sua história continua de onde parou. Entre para 
            ver as novidades do seu feed e as enquetes da
            semana.
        </p>


    </div>
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>

    <div class="campo_cadastro">
        <h2>ENTRAR</h2>

        <p>E-MAIL</p>
        <input type="text" placeholder="Informe seu E-mail" id="ipt_email">
        <p>SENHA</p>
        <input type="password" placeholder="Senha" id="ipt_senha"> 

        <button onclick="entrar()">ENTRAR</button>
        <p class="fazer_cadastro">Ainda não tem conta? <a href="cadastroPerfil.html">Criar sua Conta</a></p>
        
        <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
        </div>

        <div id="div_erros_login"></div>
        <a href="index.html" id="voltar"> ⬅️ Voltar</a>
    </div>
</body>
</html>

<script>


    function entrar() {
        

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
